# =====================================================================
# Configuración raíz de SonarQube — Atlas (análisis multi-módulo)
# El sonar-scanner-cli ejecuta desde este directorio (montado en /usr/src)
# Cada submódulo apunta a su sonar-project.properties propio pero las
# propiedades de módulos se definen aquí para el análisis centralizado.
# =====================================================================

sonar.projectKey=atlas
sonar.projectName=Sistema de Gestión Atlas
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8

# Limitar memoria RAM asignada al proceso Node.js embebido (sensor JS/TS) para evitar OOM-Killer
sonar.javascript.node.maxspace=512

# Exclusiones globales
sonar.exclusions=**/.git/**,**/node_modules/**,**/dist/**,**/.scannerwork/**,**/uploads/**
sonar.sources=sonar-project.properties

# Módulos a analizar
sonar.modules=backend,frontend

# --- backend (Node.js / Express) ---
backend.sonar.projectKey=atlas_backend
backend.sonar.projectName=Atlas - Backend
backend.sonar.projectBaseDir=BACKEND
backend.sonar.sources=src
backend.sonar.exclusions=**/node_modules/**,**/uploads/**,**/.scannerwork/**

# --- frontend (React / Vite) ---
frontend.sonar.projectKey=atlas_frontend
frontend.sonar.projectName=Atlas - Frontend
frontend.sonar.projectBaseDir=FRONTEND
frontend.sonar.sources=src
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/.scannerwork/**
